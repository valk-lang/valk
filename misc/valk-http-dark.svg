<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="HTTP hello-world benchmark: requests per second" xml:space="preserve">
<rect width="900" height="400" rx="12" fill="#1a1a19"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#ffffff">HTTP benchmarks - plain text</text>
<text x="40" y="70" font-size="14" fill="#c3c2b7">Requests per second, higher is better. 4 worker threads each, pinned to 4 cores; wrk on 8 other cores</text>
<text x="40" y="90" font-size="14" fill="#c3c2b7">900 keep-alive connections, 16 pipelined requests, median of 3 x 5 s runs</text>
<line x1="40.0" y1="108" x2="40.0" y2="332" stroke="#2c2c2a" stroke-width="1"/>
<text x="40.0" y="350" font-size="12" fill="#898781" text-anchor="start">0</text>
<line x1="157.1" y1="108" x2="157.1" y2="332" stroke="#2c2c2a" stroke-width="1"/>
<text x="157.1" y="350" font-size="12" fill="#898781" text-anchor="middle">1M</text>
<line x1="274.3" y1="108" x2="274.3" y2="332" stroke="#2c2c2a" stroke-width="1"/>
<text x="274.3" y="350" font-size="12" fill="#898781" text-anchor="middle">2M</text>
<line x1="391.4" y1="108" x2="391.4" y2="332" stroke="#2c2c2a" stroke-width="1"/>
<text x="391.4" y="350" font-size="12" fill="#898781" text-anchor="middle">3M</text>
<line x1="508.6" y1="108" x2="508.6" y2="332" stroke="#2c2c2a" stroke-width="1"/>
<text x="508.6" y="350" font-size="12" fill="#898781" text-anchor="middle">4M</text>
<line x1="625.7" y1="108" x2="625.7" y2="332" stroke="#2c2c2a" stroke-width="1"/>
<text x="625.7" y="350" font-size="12" fill="#898781" text-anchor="middle">5M</text>
<line x1="742.9" y1="108" x2="742.9" y2="332" stroke="#2c2c2a" stroke-width="1"/>
<text x="742.9" y="350" font-size="12" fill="#898781" text-anchor="middle">6M</text>
<line x1="860.0" y1="108" x2="860.0" y2="332" stroke="#2c2c2a" stroke-width="1"/>
<text x="860.0" y="350" font-size="12" fill="#898781" text-anchor="middle">7M</text>
<rect x="40" y="136" width="756.2" height="24" rx="4" fill="#3987e5"/>
<rect x="40" y="136" width="4" height="24" fill="#3987e5"/>
<text x="40" y="128" font-size="15" font-weight="600" fill="#ffffff">Valk <tspan dx="6" font-weight="400" fill="#c3c2b7">http</tspan></text>
<text x="806.2" y="153.0" font-size="14" fill="#ffffff">6.46M req/s</text>
<rect x="40" y="208" width="593.6" height="24" rx="4" fill="#4a4a47"/>
<rect x="40" y="208" width="4" height="24" fill="#4a4a47"/>
<text x="40" y="200" font-size="15" font-weight="600" fill="#ffffff">Rust <tspan dx="6" font-weight="400" fill="#c3c2b7">hyper 1.11 on tokio 1.53</tspan></text>
<text x="643.6" y="225.0" font-size="14" fill="#ffffff">5.07M req/s</text>
<rect x="40" y="280" width="403.4" height="24" rx="4" fill="#4a4a47"/>
<rect x="40" y="280" width="4" height="24" fill="#4a4a47"/>
<text x="40" y="272" font-size="15" font-weight="600" fill="#ffffff">Go <tspan dx="6" font-weight="400" fill="#c3c2b7">fasthttp 1.73</tspan></text>
<text x="453.4" y="297.0" font-size="14" fill="#ffffff">3.44M req/s</text>
<text x="40" y="382" font-size="12" fill="#898781">Valk 0.5.1, Rust 1.97.1, Go 1.27.1</text>
</svg>
