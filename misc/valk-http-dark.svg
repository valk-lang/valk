<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="title description">
<title id="title">HTTP hello-world benchmark</title>
<desc id="description">Valk http: 6,455,170 requests per second; Rust hyper 1.11 on tokio 1.53: 5,067,694 requests per second; Go fasthttp 1.73: 3,443,542 requests per second. Higher is better.</desc>
<rect x="0.5" y="0.5" width="899" height="399" rx="7" fill="#04060b" stroke="#202c45"/>
<text x="32" y="39" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="500" fill="#f1f1f7" text-anchor="start">HTTP benchmarks</text>
<text x="868" y="38" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-weight="400" fill="#b2b4c6" text-anchor="end">Valk 0.6.0</text>
<path d="M 1 64 H 899" stroke="#202c45"/>
<text x="32" y="98" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-weight="400" fill="#b2b4c6" text-anchor="start">HTTP hello world · req/s</text>
<text x="868" y="98" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-weight="400" fill="#b2b4c6" text-anchor="end">Higher is better</text>
<text x="32" y="140" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#f1f1f7" text-anchor="start">Valk</text>
<text x="88" y="140" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#b2b4c6" text-anchor="start">http</text>
<text x="868" y="140" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-weight="400" fill="#c1c5d4" text-anchor="end">6.46M req/s</text>
<rect x="32" y="154" width="836" height="12" rx="2" fill="#101726"/>
<rect x="32" y="154" width="770.9" height="12" rx="2" fill="#1268ff"/>
<text x="32" y="200" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#f1f1f7" text-anchor="start">Rust</text>
<text x="88" y="200" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#b2b4c6" text-anchor="start">hyper 1.11 on tokio 1.53</text>
<text x="868" y="200" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-weight="400" fill="#c1c5d4" text-anchor="end">5.07M req/s</text>
<rect x="32" y="214" width="836" height="12" rx="2" fill="#101726"/>
<rect x="32" y="214" width="605.2" height="12" rx="2" fill="#42618c"/>
<text x="32" y="260" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#f1f1f7" text-anchor="start">Go</text>
<text x="88" y="260" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#b2b4c6" text-anchor="start">fasthttp 1.73</text>
<text x="868" y="260" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-weight="400" fill="#c1c5d4" text-anchor="end">3.44M req/s</text>
<rect x="32" y="274" width="836" height="12" rx="2" fill="#101726"/>
<rect x="32" y="274" width="411.3" height="12" rx="2" fill="#42618c"/>
<path d="M 1 312 H 899" stroke="#202c45"/>
<text x="32" y="338" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#b2b4c6" text-anchor="start">4 workers pinned to 4 cores; wrk on 8 other cores.</text>
<text x="32" y="360" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#b2b4c6" text-anchor="start">900 keep-alive connections · 16 pipelined requests · Median of three 5-second runs.</text>
<text x="32" y="382" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-weight="400" fill="#b2b4c6" text-anchor="start">Valk 0.6.0 · Rust 1.97.1 · Go 1.27.1</text>
</svg>
