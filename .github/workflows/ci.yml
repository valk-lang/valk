name: ci

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    types: [ready_for_review, synchronize, opened]
    branches: [ main ]

env:
  COMPILER_VERSION: "0.4.2"

jobs:
  linux-x64:
    name: "Test linux-x64"
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get LLVM from cache
        id: cache-llvm-linux-x64
        uses: actions/cache@v4
        with:
          path: toolchains/libraries/linux-llvm-22-x64
          key: cache-llvm-linux-x64-22-c42cd795-${{ hashFiles('.github/ci-cache.txt') }}

      - name: Download LLVM
        if: steps.cache-llvm-linux-x64.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains/libraries
          curl -fL -o "${RUNNER_TEMP}/linux-llvm-22-x64.tar.gz" https://files.valk-cdn.dev/toolchains/linux-llvm-22-x64.tar.gz
          echo "c42cd795a18d59d7f065eb7620f81804ff10c2670853d4e3af5082862268bbbc  ${RUNNER_TEMP}/linux-llvm-22-x64.tar.gz" | sha256sum -c -
          tar -xf "${RUNNER_TEMP}/linux-llvm-22-x64.tar.gz" -C toolchains/libraries

      - name: Validate LLVM
        run: test -f toolchains/libraries/linux-llvm-22-x64/lib/libLLVMCore.a

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install lld g++ zlib1g-dev libzstd-dev libncurses-dev libxml2-dev libicu-dev

      - name: Get compiler from cache
        id: cache-compiler-linux-x64
        uses: actions/cache@v4
        with:
          path: valk-${{ env.COMPILER_VERSION }}-linux-x64.tar.gz
          key: cache-compiler-linux-x64-${{ hashFiles('.github/ci-cache.txt') }}

      - name: Download compiler
        if: steps.cache-compiler-linux-x64.outputs.cache-hit != 'true'
        run: curl -O https://files.valk-cdn.dev/releases/valk/${{ env.COMPILER_VERSION }}/valk-${{ env.COMPILER_VERSION }}-linux-x64.tar.gz

      - name: Install compiler
        run: |
          mkdir -p ~/valk-dev
          tar -xf valk-${{ env.COMPILER_VERSION }}-linux-x64.tar.gz -C ~/valk-dev
          ln -s -f ~/valk-dev/valk /usr/local/bin/valk

      - name: Build valk
        run: make ci-linux

      - name: Run all tests
        run: make test-all

      # Same suite with the GC's internal assertions on. They are
      # #if GC_DEBUG, so they cost nothing in the builds above, but here
      # a corrupted property slot or a misaligned root panics by name
      # instead of surfacing later as a fault on some unrelated victim.
      - name: Run tests with GC debug checks
        run: make test-gc-debug

      - name: Run tests with the clang backend
        run: make test-clang

      - name: LLD symlinks
        run: sudo ./valk linker-symlinks

      - name: Cross compile test
        run: make test-cross

  macos-x64:
    name: "Test macos-x64"
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get LLVM from cache
        id: cache-llvm-macos-x64
        uses: actions/cache@v4
        with:
          path: toolchains/libraries/macos-llvm-22-x64
          key: cache-llvm-macos-x64-22-40c44372-${{ hashFiles('.github/ci-cache.txt') }}

      - name: Download LLVM
        if: steps.cache-llvm-macos-x64.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains/libraries
          curl -fL -o "${RUNNER_TEMP}/macos-llvm-22-x64.tar.gz" https://files.valk-cdn.dev/toolchains/macos-llvm-22-x64.tar.gz
          echo "40c443726c8d520d3ad2309fb6ba9ebfde96d5fa07a6d1e476f6e2775a9e350c  ${RUNNER_TEMP}/macos-llvm-22-x64.tar.gz" | shasum -a 256 -c -
          tar -xf "${RUNNER_TEMP}/macos-llvm-22-x64.tar.gz" -C toolchains/libraries

      - name: Validate LLVM
        run: test -f toolchains/libraries/macos-llvm-22-x64/lib/libLLVMCore.a

      - name: Cache Homebrew lld
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-lld-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci-cache.txt') }}

      - name: Install lld
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install lld

      - name: Get compiler from cache
        id: cache-compiler-macos-x64
        uses: actions/cache@v4
        with:
          path: valk-${{ env.COMPILER_VERSION }}-macos-x64.tar.gz
          key: cache-compiler-macos-x64-${{ hashFiles('.github/ci-cache.txt') }}

      - name: Download compiler
        if: steps.cache-compiler-macos-x64.outputs.cache-hit != 'true'
        run: curl -O https://files.valk-cdn.dev/releases/valk/${{ env.COMPILER_VERSION }}/valk-${{ env.COMPILER_VERSION }}-macos-x64.tar.gz

      - name: Install compiler
        run: |
          mkdir -p ~/valk-dev
          tar -xf valk-${{ env.COMPILER_VERSION }}-macos-x64.tar.gz -C ~/valk-dev
          ln -s -f ~/valk-dev/valk /usr/local/bin/valk

      - name: Build valk
        run: make ci-macos

      - name: Run native runtime and library tests
        run: make test test-library

      - name: LLD symlinks
        run: sudo ./valk linker-symlinks

      # - name: Cross compile test
      #   run: make test-cross

  macos-arm64:
    name: "Test macos-arm64"
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get LLVM from cache
        id: cache-llvm-macos-arm64
        uses: actions/cache@v4
        with:
          path: toolchains/libraries/macos-llvm-22-arm64
          key: cache-llvm-macos-arm64-22-26df3dd4-${{ hashFiles('.github/ci-cache.txt') }}

      - name: Download LLVM
        if: steps.cache-llvm-macos-arm64.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains/libraries
          curl -fL -o "${RUNNER_TEMP}/macos-llvm-22-arm64.tar.gz" https://files.valk-cdn.dev/toolchains/macos-llvm-22-arm64.tar.gz
          echo "26df3dd4db9ebba2817fe6eb73d5fad27fcddc9d4ad4b650862e36b568685e25  ${RUNNER_TEMP}/macos-llvm-22-arm64.tar.gz" | shasum -a 256 -c -
          tar -xf "${RUNNER_TEMP}/macos-llvm-22-arm64.tar.gz" -C toolchains/libraries

      - name: Validate LLVM
        run: test -f toolchains/libraries/macos-llvm-22-arm64/lib/libLLVMCore.a

      - name: Cache Homebrew lld
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-lld-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci-cache.txt') }}

      - name: Install lld
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install lld

      - name: Get compiler from cache
        id: cache-compiler-macos-arm64
        uses: actions/cache@v4
        with:
          path: valk-${{ env.COMPILER_VERSION }}-macos-arm64.tar.gz
          key: cache-compiler-macos-arm64-${{ hashFiles('.github/ci-cache.txt') }}

      - name: Download compiler
        if: steps.cache-compiler-macos-arm64.outputs.cache-hit != 'true'
        run: curl -O https://files.valk-cdn.dev/releases/valk/${{ env.COMPILER_VERSION }}/valk-${{ env.COMPILER_VERSION }}-macos-arm64.tar.gz

      - name: Install compiler
        run: |
          mkdir -p ~/valk-dev
          tar -xf valk-${{ env.COMPILER_VERSION }}-macos-arm64.tar.gz -C ~/valk-dev
          ln -s -f ~/valk-dev/valk /usr/local/bin/valk

      - name: Build valk
        run: make ci-macos

      - name: Run all tests
        run: make test-all

      # Same suite with the GC's internal assertions on. They are
      # #if GC_DEBUG, so they cost nothing in the builds above, but here
      # a corrupted property slot or a misaligned root panics by name
      # instead of surfacing later as a fault on some unrelated victim.
      - name: Run tests with GC debug checks
        run: make test-gc-debug

      - name: LLD symlinks
        run: sudo ./valk linker-symlinks

      - name: Cross compile test
        run: make test-cross


  win-x64:
    name: "Test win-x64"
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get LLVM from cache
        id: cache-llvm-win-x64
        uses: actions/cache@v4
        with:
          path: toolchains/libraries/win-llvm-22-x64
          key: cache-llvm-win-x64-22-79913c90-${{ hashFiles('.github/ci-cache.txt') }}

      - name: Download LLVM
        if: steps.cache-llvm-win-x64.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path "toolchains/libraries"
          curl.exe -fL -o "$env:RUNNER_TEMP/win-llvm-22-x64.tar.gz" https://files.valk-cdn.dev/toolchains/win-llvm-22-x64.tar.gz
          if ((Get-FileHash "$env:RUNNER_TEMP/win-llvm-22-x64.tar.gz" -Algorithm SHA256).Hash.ToLower() -ne "79913c901f46fe84c5825eb4cb606547fc29af7d99ff63bda2b1fdf092c57c0a") { throw "Invalid LLVM archive checksum" }
          tar -xf "$env:RUNNER_TEMP/win-llvm-22-x64.tar.gz" -C toolchains/libraries

      - name: Validate LLVM
        run: if (!(Test-Path "toolchains/libraries/win-llvm-22-x64/lib/LLVMCore.lib")) { throw "Missing LLVMCore.lib" }

      - name: Get compiler from cache
        id: cache-compiler-win-x64
        uses: actions/cache@v4
        with:
          path: valk-${{ env.COMPILER_VERSION }}-win-x64.zip
          key: cache-compiler-win-x64-${{ hashFiles('.github/ci-cache.txt') }}

      - name: Download compiler
        if: steps.cache-compiler-win-x64.outputs.cache-hit != 'true'
        run: curl -O https://files.valk-cdn.dev/releases/valk/${{ env.COMPILER_VERSION }}/valk-${{ env.COMPILER_VERSION }}-win-x64.zip

      - name: Install compiler
        run: |
          mkdir -Force ~/valk-dev
          unzip valk-${{ env.COMPILER_VERSION }}-win-x64.zip -d ~/valk-dev
          ln -s -f ~/valk-dev/lld-link.exe /usr/bin/lld-link.exe
          cp ~/valk-dev/lld-link.exe .

      - name: Configure system libraries
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$visualStudio) { throw "Visual Studio C++ tools not found" }
          $msvc = Get-ChildItem "$visualStudio/VC/Tools/MSVC" -Directory | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $sdkRoot = "${env:ProgramFiles(x86)}/Windows Kits/10/Lib"
          $sdk = Get-ChildItem $sdkRoot -Directory | Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          if (!$sdk) { throw "Windows SDK libraries not found" }
          $flags = "-L `"$($msvc.FullName)/lib/x64`" -L `"$($sdk.FullName)/ucrt/x64`" -L `"$($sdk.FullName)/um/x64`""
          "CI_SYSTEM_LIB_FLAGS=$flags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build valk
        run: make ci-win

      - name: Run all tests
        run: |
          ./valk.exe -h || echo ""
          curl -O https://curl.se/ca/cacert.pem
          make test-all TEST_COMPILER=./valk.exe EXE_SUFFIX=.exe

      - name: LLD symlinks
        run: ./valk.exe linker-symlinks

      - name: Cross compile test
        run: |
          ./valk.exe build (get-item ./tests/*.valk).FullName ./tests --test -o ./test-cross.exe -vv --def "DEF_TEST=TestValue" --target linux-x64
          ./valk.exe build (get-item ./tests/*.valk).FullName ./tests --test -o ./test-cross.exe -vv --def "DEF_TEST=TestValue" --target macos-x64
          ./valk.exe build (get-item ./tests/*.valk).FullName ./tests --test -o ./test-cross.exe -vv --def "DEF_TEST=TestValue" --target macos-arm64
          ./valk.exe build (get-item ./tests/*.valk).FullName ./tests --test -o ./test-cross.exe -vv --def "DEF_TEST=TestValue" --target win-x64
